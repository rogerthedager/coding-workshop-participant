[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.coverage.run]
# The async SQLAlchemy engine runs ORM code in greenlets; without this, coverage misses it.
concurrency = ["greenlet", "thread"]
